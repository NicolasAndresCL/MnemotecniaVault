name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff, hadolint, compose, kustomize)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install ruff==0.17.1
      - run: ruff check .
      - run: ruff format --check .
      - name: Scripts con bit de ejecución
        run: |
          if git ls-files -s -- '*.sh' | grep -v '^100755'; then
            echo "::error::Scripts sin bit de ejecución (git update-index --chmod=+x)"; exit 1
          fi
      - name: hadolint
        run: docker run --rm -i hadolint/hadolint < Dockerfile
      - name: docker compose config
        env:
          POSTGRES_PASSWORD: ci
          STORAGE_SECRET: ci
        run: docker compose config --quiet
      - name: Manifiestos Kubernetes (kustomize + kubeconform)
        run: kubectl kustomize k8s | docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0 -strict -summary

  test:
    name: Tests (SQLite)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -rs --cov --cov-report=term-missing --cov-fail-under=90

  test-postgres:
    name: Tests (Postgres 18)
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -rs

  build:
    name: Build + arranque del stack
    needs: [test, test-postgres]
    runs-on: ubuntu-latest
    env:
      IMPORT_ON_STARTUP: "false"
    steps:
      - uses: actions/checkout@v7
      - name: .env efímero para CI
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "STORAGE_SECRET=$(openssl rand -hex 24)"
          } > .env
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 180
      - run: ./scripts/smoke.sh http://localhost:8095
      - name: Logs si falla
        if: failure()
        run: docker compose logs --no-color --tail=200
      - if: always()
        run: docker compose down -v
