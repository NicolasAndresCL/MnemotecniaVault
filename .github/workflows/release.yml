name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    name: GitHub Release desde el CHANGELOG
    runs-on: ubuntu-latest
    permissions:
      contents: write   # solo este job puede crear la release
    steps:
      - uses: actions/checkout@v7

      - name: El tag coincide con la versión del proyecto
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -qF "version = \"$v\"" pyproject.toml \
            || { echo "::error::pyproject.toml no tiene version = \"$v\""; exit 1; }
          grep -qF "__version__ = \"$v\"" app/__init__.py \
            || { echo "::error::app/__init__.py no tiene __version__ = \"$v\""; exit 1; }

      - name: Notas desde la sección del CHANGELOG
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' \
            CHANGELOG.md > notas.md
          test -s notas.md || { echo "::error::CHANGELOG.md sin sección [$v]"; exit 1; }

      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*|v0.*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file notas.md $flags
